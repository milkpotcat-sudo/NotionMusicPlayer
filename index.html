<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>Notion Music Player</title>

<style>

body{

  margin:0;

  background:white;

  display:flex;
  justify-content:center;
  align-items:center;

  height:100vh;

  overflow:hidden;

  font-family:
    "Noto Sans JP",
    sans-serif;
}


/* ======================
   PLAYER
====================== */

.player{

  width:320px;
  height:112px;

  background:#FAF5F4;

  border-radius:28px;

  display:flex;
  align-items:center;

  gap:16px;

  padding:16px;

  box-sizing:border-box;

  position:relative;

  overflow:hidden;

  box-shadow:
    0 3px 10px rgba(0,0,0,.05);
}


/* ======================
   WOOD TEXTURE
====================== */

.player::before{

  content:"";

  position:absolute;

  inset:0;

  opacity:.05;

  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.5),
      rgba(255,255,255,.5) 2px,
      transparent 2px,
      transparent 7px
    );

  pointer-events:none;
}


/* ======================
   NOISE
====================== */

.player::after{

  content:"";

  position:absolute;

  inset:0;

  opacity:.035;

  background-image:
    radial-gradient(
      #000 0.5px,
      transparent 0.5px
    );

  background-size:
    4px 4px;

  pointer-events:none;
}


/* ======================
   RECORD AREA
====================== */

.record-area{

  position:relative;

  width:84px;
  height:84px;

  display:flex;
  justify-content:center;
  align-items:center;

  flex-shrink:0;
}


/* ======================
   RECORD
====================== */

.record{

  width:72px;
  height:72px;

  border-radius:50%;

  background:
    radial-gradient(circle,
    #d8b9a8 0 9px,
    #252525 9px 13px,
    #303030 13px 100%);

  position:relative;

  box-shadow:
    0 4px 12px rgba(0,0,0,.14);
}


/* RECORD GROOVES */

.record::before{

  content:"";

  position:absolute;

  inset:10px;

  border-radius:50%;

  border:
    1px solid rgba(255,255,255,.08);
}


/* ======================
   RECORD ARM
====================== */

.arm{

  position:absolute;

  width:54px;
  height:5px;

  background:#b39b8d;

  border-radius:999px;

  top:10px;
  right:-2px;

  transform:
    rotate(28deg);

  transform-origin:left center;

  box-shadow:
    0 1px 3px rgba(0,0,0,.12);
}


.arm::before{

  content:"";

  position:absolute;

  width:12px;
  height:12px;

  border-radius:50%;

  background:#cab3a5;

  left:-6px;
  top:-3.5px;
}


.arm::after{

  content:"";

  position:absolute;

  width:8px;
  height:8px;

  background:#e8d6cb;

  right:-2px;
  top:-1.5px;

  border-radius:2px;
}


/* ======================
   SPIN
====================== */

.spin{

  animation:
    spin 4s linear infinite;
}


@keyframes spin{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}


/* ======================
   CONTENT
====================== */

.content{

  flex:1;

  min-width:0;
}


/* ======================
   TITLE
====================== */

.title{

  font-size:14px;

  color:#725f55;

  margin-bottom:10px;

  line-height:1.4;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* ======================
   CONTROLS
====================== */

.controls{

  display:flex;
  align-items:center;

  gap:8px;
}


/* ======================
   BUTTON
====================== */

button{

  width:30px;
  height:30px;

  border:none;

  border-radius:50%;

  background:#dcb9a6;

  color:white;

  cursor:pointer;

  font-size:11px;

  transition:.2s;

  flex-shrink:0;
}


button:hover{

  transform:
    translateY(-1px);

  opacity:.92;
}


/* ======================
   VOLUME
====================== */

input[type="range"]{

  width:64px;

  accent-color:#dcb9a6;

  cursor:pointer;
}

</style>

</head>

<body>



<div class="player">


  <div class="record-area">

    <div
      class="record"
      id="record"
    ></div>

    <div class="arm"></div>

  </div>



  <div class="content">


    <div
      class="title"
      id="title"
    >
      loading...
    </div>



    <div class="controls">

      <button id="playBtn">
        ▶
      </button>

      <button id="pauseBtn">
        ❚❚
      </button>

      <button id="randomBtn">
        ⤮
      </button>

      <input
        type="range"
        id="volume"
        min="0"
        max="100"
        value="35"
      />

    </div>


  </div>


</div>



<audio
  id="audio"
  loop
></audio>



<script>

/* ======================
   PLAYLIST
====================== */

const playlist = [

{
  start:0,
  end:3,
  title:'Sleep Aid￤月光浴',
  src:'https://milkpotcat-sudo.github.io/NotionMusicPlayer/Clip1.m4a'
},

{
  start:4,
  end:7,
  title:'Spring Morning￤ベーカリーカフェ',
  src:'https://milkpotcat-sudo.github.io/NotionMusicPlayer/Clip2.m4a'
},

{
  start:8,
  end:11,
  title:'Lofty Library￤森の図書館',
  src:'https://milkpotcat-sudo.github.io/NotionMusicPlayer/Clip3.m4a'
},

{
  start:12,
  end:15,
  title:'Chill Cabin￤水族館',
  src:'https://milkpotcat-sudo.github.io/NotionMusicPlayer/Clip4.m4a'
},

{
  start:16,
  end:19,
  title:'Night Cafe￤レトロカフェ',
  src:'https://milkpotcat-sudo.github.io/NotionMusicPlayer/Clip5.m4a'
},

{
  start:20,
  end:23,
  title:'The Roost￤喫茶ハトの巣',
  src:'https://milkpotcat-sudo.github.io/NotionMusicPlayer/Clip6.m4a'
}

];


/* ======================
   ELEMENTS
====================== */

const audio =
  document.getElementById('audio');

const title =
  document.getElementById('title');

const playBtn =
  document.getElementById('playBtn');

const pauseBtn =
  document.getElementById('pauseBtn');

const randomBtn =
  document.getElementById('randomBtn');

const volume =
  document.getElementById('volume');

const record =
  document.getElementById('record');


/* ======================
   TRACK SELECT
====================== */

function getCurrentTrack(){

  const hour =
    new Date().getHours();

  return playlist.find(
    track =>
      hour >= track.start &&
      hour <= track.end
  );

}


/* ======================
   LOAD TRACK
====================== */

let currentTrack =
  getCurrentTrack();

function loadTrack(track){

  currentTrack = track;

  audio.src = track.src;

  title.textContent =
    track.title;

}

loadTrack(currentTrack);


/* ======================
   PLAY
====================== */

playBtn.addEventListener(
  'click',
  async()=>{

    try{

      await audio.play();

      record.classList.add(
        'spin'
      );

    }catch(err){

      console.log(err);

    }

});


/* ======================
   PAUSE
====================== */

pauseBtn.addEventListener(
  'click',
  ()=>{

    audio.pause();

    record.classList.remove(
      'spin'
    );

});


/* ======================
   RANDOM
====================== */

randomBtn.addEventListener(
  'click',
  ()=>{

    const random =
      playlist[
        Math.floor(
          Math.random() *
          playlist.length
        )
      ];

    loadTrack(random);

    audio.play();

    record.classList.add(
      'spin'
    );

});


/* ======================
   VOLUME
====================== */

audio.volume = 0.35;

volume.addEventListener(
  'input',
  e=>{

    audio.volume =
      e.target.value / 100;

});


/* ======================
   AUTO TRACK CHANGE
====================== */

setInterval(()=>{

  const newTrack =
    getCurrentTrack();

  if(
    newTrack.title !==
    currentTrack.title
  ){

    const wasPlaying =
      !audio.paused;

    loadTrack(newTrack);

    if(wasPlaying){

      audio.play();

    }

  }

},60000);

</script>

</body>

</html>
